<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/98c1abacbc.js" crossorigin="anonymous"></script>
    <style>
@import url('https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Playwrite+NZ+Basic:wght@100..400&family=Roboto+Slab:wght@100..900&display=swap');
</style>
    <link rel="stylesheet" href="/source/contact/styles.css">
    <title>Portfolio-Mini</title>
</head>
<body>
    <header>
        <div class="header">
        <div class="left-nav">Portfolio<span class="span">.Seavhor</span></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="aboutme.html">About Me</a>
            <a href="projectbefore.html">What I do</a>
            <a href="skill.html">Skills</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="right-nav">
            <div class="icon"><i class="fa-brands fa-facebook"></i></div>
            <a class="link" href="https://web.facebook.com/bouseavhor" target="_blank">Add FB</a>
        </div>
        </div>
    </header>
    <section class="contact-section">
    <div class="contact-container">

        <!-- Left Side -->
        <div class="contact-info">
            <p class="small-title">CONTACT</p>

            <h1>
                Let's work
                <span>together.</span>
            </h1>

            <p class="description">
                Have a project in mind or want to work together?
                Feel free to contact me.
            </p>

            <div class="contact-details">

                <div class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <span>Email</span>
                        <a href="mailto:yourname@gmail.com">
                            bouseavhor@gmail.com
                        </a>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <span>Location</span>
                        <p>Kandal, Cambodia</p>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fa-brands fa-facebook"></i>
                    <div>
                        <span>Facebook</span>
                        <a href="https://web.facebook.com/bouseavhor"
                           target="_blank">
                            Add FB
                        </a>
                    </div>
                </div>

            </div>
        </div>


        <!-- Right Side -->
        <div class="contact-form">

            <form>

                <div class="input-group">
                    <label for="name">Your Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >
                </div>

                <div class="input-group">
                    <label for="email">Your Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >
                </div>

                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        rows="6"
                        placeholder="Write your message..."
                    ></textarea>
                </div>

                <button type="submit">
                    Send Message
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

        </div>

    </div>
</section>
</body>
</html>
